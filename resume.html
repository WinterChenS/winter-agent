  <script>
    const resumes = {
      lead: {
        button: document.querySelector('[data-switch="lead"]'),
        article: document.getElementById("resume-lead"),
        markdown: document.getElementById("md-lead").innerHTML.trim(),
        title: "陈冬华-杭州-技术负责人"
      },
      fullstack: {
        button: document.querySelector('[data-switch="fullstack"]'),
        article: document.getElementById("resume-fullstack"),
        markdown: document.getElementById("md-fullstack").innerHTML.trim(),
        title: "陈冬华-杭州-全栈开发"
      }
    };

    function escapeHtml(value) {
      return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function inlineMarkdown(value) {
      return escapeHtml(value)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/：/g, "：")
        .replace(/([^!])\[([^\]]+)\]\(([^)]+)\)/g, '$1<a href="$3" target="_blank" rel="noreferrer">$2</a>');
    }

    function parseTable(lines, start) {
      const rows = [];
      let index = start;
      while (index < lines.length && /^\s*\|.+\|\s*$/.test(lines[index])) {
        rows.push(lines[index].trim());
        index += 1;
      }

      if (rows.length < 2 || !/^\|\s*:?-{3,}:?\s*\|/.test(rows[1])) {
        return null;
      }

      const cells = row => row
        .replace(/^\|/, "")
        .replace(/\|$/, "")
        .split("|")
        .map(cell => inlineMarkdown(cell.trim()));

      const head = cells(rows[0]);
      const body = rows.slice(2).map(cells);
      const html = [
        "<table>",
        "<thead><tr>",
        ...head.map(cell => `<th>${cell}</th>`),
        "</tr></thead>",
        "<tbody>",
        ...body.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join("")}</tr>`),
        "</tbody></table>"
      ].join("");

      return { html, next: index };
    }

    function parseMarkdown(markdown) {
      const lines = markdown.split(/\r?\n/);
      const parts = [];
      let i = 0;

      while (i < lines.length) {
        const raw = lines[i];
        const line = raw.trim();

        if (!line) {
          i += 1;
          continue;
        }

        const table = parseTable(lines, i);
        if (table) {
          parts.push(table.html);
          i = table.next;
          continue;
        }

        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
          const level = heading[1].length;
          parts.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
          i += 1;
          continue;
        }

        if (/^-\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^-\s+/.test(lines[i].trim())) {
            items.push(`<li>${inlineMarkdown(lines[i].trim().replace(/^-\s+/, ""))}</li>`);
            i += 1;
          }
          parts.push(`<ul>${items.join("")}</ul>`);
          continue;
        }

        parts.push(`<p>${inlineMarkdown(line.replace(/\s{2,}$/, ""))}</p>`);
        i += 1;
      }

      return parts.join("\n");
    }

    function activate(kind) {
      Object.entries(resumes).forEach(([key, resume]) => {
        const active = key === kind;
        resume.article.classList.toggle("active", active);
        resume.button.setAttribute("aria-pressed", String(active));
        if (active) {
          document.title = resume.title;
          localStorage.setItem("preferred-resume", kind);
        }
      });
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    Object.values(resumes).forEach(resume => {
      resume.article.innerHTML = parseMarkdown(resume.markdown);
    });

    document.querySelectorAll("[data-switch]").forEach(button => {
      button.addEventListener("click", () => activate(button.dataset.switch));
    });

    document.getElementById("printBtn").addEventListener("click", () => {
      window.print();
    });

    activate(localStorage.getItem("preferred-resume") || "lead");
  </script>
