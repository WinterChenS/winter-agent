# ── Entrypoints ─────────────────────────────────────────────────────
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

# ── Let's Encrypt ───────────────────────────────────────────────────
certificatesResolvers:
  letsencrypt:
    acme:
      email: ${ACME_EMAIL:-admin@example.com}
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

# ── Docker Provider ─────────────────────────────────────────────────
providers:
  docker:
    exposedByDefault: false
    network: ai-chat-network

# ── API/Dashboard (internal only) ────────────────────────────────────
api:
  dashboard: true

# ── Logging ──────────────────────────────────────────────────────────
log:
  level: INFO

accessLog: {}
